
version: '3.8'

services:
  # Backend service for the Recipe Sharing API
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - recipe_data:/app/data

  # Fix the SQLite database path so recipes are saved in the
  # Docker volume and remain available when containers are recreated.
    command:
      - sh
      - -c
      - "rm -f /app/recipes.db && ln -s /app/data/recipes.db /app/recipes.db && npm start"

  # Frontend service for the React application
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:5000

# Named volume to persist the SQLite database
volumes:
  recipe_data:
