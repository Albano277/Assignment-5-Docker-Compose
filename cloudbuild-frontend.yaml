steps:
  # Build the frontend Docker image with build-time env var
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', '--build-arg',
      'VITE_API_URL=https://recipe-backend-767018512586.us-central1.run.app',
      '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend',
      './frontend'
    ]

  # Push the image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args: [
      'run', 'deploy',
      'recipe-frontend', '--image',
      'us-central1-docker.pkg.dev/$PROJECT_ID/recipe-images/recipe-frontend',
      '--platform', 'managed',
      '--region', 'us-central1',
      '--allow-unauthenticated',
      '--port', '80'
    ]

options:
  logging: CLOUD_LOGGING_ONLY